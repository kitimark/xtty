schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  xtty — a native macOS terminal emulator (greenfield, exploration → build phase).

  Stack (primary, "All-Swift"):
    - UI/chrome: Swift + SwiftUI/AppKit
    - Renderer: custom Metal view (MTKView/CAMetalLayer), CoreText glyph atlas,
      dedicated render thread, latency-first (frame pacing > throughput)
    - VT engine: reuse SwiftTerm's headless Terminal core (parser + grid)
    - PTY: Darwin posix_openpt/forkpty + kqueue read/write loop
    - Shell integration: OSC 7 (cwd) + OSC 133 (command boundaries) capture
    Alternatives on file if we hit limits: Rust core + Swift GUI; Zig/libghostty
    + Swift; Swift + libghostty-vt. See research/04-design/01-stack-sketch.md.

  Product values (hard requirements):
    - Lean memory (nowhere near Warp; bound scrollback, manage atlas, no retain cycles)
    - No account / no login, free and open, no paywalled features
    - Native macOS feel; keep the user's existing zsh/tmux/dotfiles working
    - Be a great host for agent CLIs (Claude Code, etc.); agents pluggable/local, not vendor-locked

  Signature features: at-a-glance per-session progress sidebar (from OSC 133),
  a lightweight in-terminal file/diff view (not a full IDE).

  Background research lives in research/ (landscape, internals, requirements,
  stack sketch, milestones). Implementation follows the phased plan in
  research/04-design/02-milestones.md (P0 skeleton → P5 daily-driver →
  P7 OSC capture keystone → P8 sidebar → P10 polish).

  Conventions: macOS-first; reuse battle-tested components over hand-rolling
  (esp. the VT parser); favor latency and low memory in every tradeoff.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - >-
      Delegation markers: author any verify task that runs the Tier-1 XCUITest
      suite (`make test`), a VM tier, or a full acceptance matrix with the
      marker `⟶ xtty-test-validator (<tier/scope>)` in the task line, so the
      apply loop delegates it to the test-validation agent instead of running
      the suite inline. Cheap checks (`make test-core` for iteration, one-off
      app launches, greps, `make doctor`, `openspec validate`) stay unmarked
      and inline. See AGENTS.md → "How to work here" → test-validation for the
      authoritative inline-vs-delegate boundary — this rule only points there.
    - >-
      CI-investigation markers: author any task that *investigates a failed CI
      run* (pulling logs/`.xcresult`/attachments to classify the failures) with
      the marker `⟶ xtty-ci-investigator (<run>)` in the task line, so the apply
      loop delegates it to the CI-investigation agent. Merely *watching* a run
      (`gh run watch`/`gh run view` for status) stays unmarked and inline. See
      AGENTS.md → "How to work here" → CI-failure investigation for the
      authoritative watch-vs-investigate boundary — this rule only points there.
    - >-
      Coherence-review markers: author any task that runs a *full coherence
      review* of a change (the coherence rules + disk-drift + cross-change
      passes) with the marker `⟶ xtty-openspec-critic (<change|all>)` in the
      task line, so the apply/propose loop delegates it to the coherence-review
      agent. Running `openspec validate` (the cheap mechanical gate) stays
      unmarked and inline. See AGENTS.md → "How to work here" → coherence
      review for the authoritative validate-vs-review boundary — this rule only
      points there.
    - >-
      Archive-ritual marker: author the change's completion task — archive +
      reconcile — with the marker `⟶ archive-ritual` in the task line, so the
      apply loop runs the full ritual (`openspec archive` + finish-by-hand +
      tracker reconcile + verify-against-disk) rather than leaving archive
      implicit in an "on completion" clause. Unlike the delegation markers this
      points to an inline committed procedure, not an agent. See AGENTS.md →
      "How to work here" → Keep progress current (the standard change tail) for
      the authoritative archive ritual — this rule only points there.
